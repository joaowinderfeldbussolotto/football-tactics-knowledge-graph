[project]
name = "football-graphrag-poc"
version = "0.1.0"
description = "GraphRAG tatico para futebol: Graphiti + Neo4j + StatsBomb Open Data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "graphiti-core>=0.29.0,<0.30",
    # Pinado em 3.15.x: socceraction 1.5.3 depende de uma API interna do
    # kloppy (CoordinateSystem) que quebrou em versões mais novas (3.16+).
    "kloppy==3.15.0",
    "socceraction>=1.5.3,<2",
    "pydantic-ai>=2.11.0,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.14,<3",
    "fastapi>=0.139.0,<1",
    "uvicorn[standard]>=0.34,<1",
    "redis>=5.2,<6",
    "langfuse>=3.0,<5",
    "opentelemetry-sdk>=1.28,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17,<20",
    "anthropic>=0.40,<1",
    "openai>=2.45.0,<3",
    "google-genai>=1.70.0,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "xgboost>=2.1,<3",
    "scikit-learn>=1.5,<2",
    "multimethod<2",
    "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_graphrag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
