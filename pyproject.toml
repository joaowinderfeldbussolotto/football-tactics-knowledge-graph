[project]
name = "football-graphrag"
version = "0.1.0"
description = "PoC: grafo tático de futebol com insights não triviais (StatsBomb -> SPADL -> Neo4j/GDS -> Graphiti + PydanticAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kloppy>=3.15",
    "socceraction>=1.5",
    "statsbombpy>=1.13",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "neo4j>=5.20",
    "graphiti-core>=0.11",
    "pydantic-ai-slim[openai,anthropic,google,mistral]>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "langfuse>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
