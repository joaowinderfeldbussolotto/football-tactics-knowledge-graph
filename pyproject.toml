[project]
name = "football-graphrag"
version = "0.1.0"
description = "Benchmark: como permitir perguntas em linguagem natural sobre eventos de futebol (StatsBomb -> SPADL -> Neo4j/GDS -> PydanticAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # kloppy pinado: socceraction 1.5.3 quebra com kloppy >=3.17 (ADR-4)
    "kloppy==3.16.0",
    "socceraction>=1.5",
    "statsbombpy>=1.13",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # multimethod 2.x quebra o pandera que o socceraction importa
    "multimethod<2",
    # xgboost: treino único do VAEP (ADR-3)
    "xgboost>=2.0",
    "neo4j>=5.20",
    "pydantic-ai-slim[openai,anthropic,google,mistral]>=0.2",
    "pydantic-settings>=2.2",
    "langfuse>=3.0",
    "networkx>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
