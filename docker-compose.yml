services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: uvicorn football_graphrag.api.main:app --host 0.0.0.0 --port 8000

  replay-worker:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python -m football_graphrag.ingestion.replay

volumes:
  neo4j_data:
