# Override de desenvolvimento: hot-reload + bind mount do código.
# `docker compose up` aplica este arquivo automaticamente em dev.
services:
  api:
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./src:/app/src
      - ./scripts:/app/scripts
    command: uvicorn football_graphrag.api.main:app --host 0.0.0.0 --port 8000 --reload
