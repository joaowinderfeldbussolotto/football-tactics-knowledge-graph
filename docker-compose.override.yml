services:
  api:
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
    command: uvicorn football_graphrag.api.main:app --host 0.0.0.0 --port 8000 --reload

  replay-worker:
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
