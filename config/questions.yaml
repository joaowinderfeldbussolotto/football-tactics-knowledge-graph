# Perguntas do benchmark (v2): a final da Copa do Mundo de 2022 (Argentina x França).
#
# Este arquivo é a única fonte das perguntas. O código lê daqui
# (src/football_graphrag/benchmark/questions.py) e valida ao carregar.
#
# Campos de cada pergunta:
#   id         prefixo pelo tipo + número: f (fact), a (filtered_aggregation),
#              n (network), s (network_slice), u (unanswerable), t (structure),
#              c (counterfactual), q (sequence), p (play), b (substitution)
#   type       fact | filtered_aggregation | network | network_slice | unanswerable |
#              structure | counterfactual | sequence | play | substitution
#   stage      pilot     entra no benchmark principal
#              full      entra no benchmark principal (junto com as pilot)
#              graph     perguntas que exploram relações do grafo
#              candidate escrita e estável, mas fora das rodadas
#              removed   a resposta muda conforme a leitura: fica só como registro
#   check      como a resposta é conferida:
#                player            o 1º jogador da resposta é o esperado
#                value             o número é o esperado (dentro de tolerance)
#                set               o conjunto de jogadores é o esperado, em qualquer ordem
#                player_and_value  as duas coisas
#                no_data           o modelo disse que os dados não respondem
#   tolerance  opcional; só para valores contínuos. Contagens são exatas (0).
#   text       a pergunta, exatamente como vai para o modelo
#   note       opcional; por que a pergunta existe, por que saiu ou um cuidado.
#              NÃO vai para o modelo.
#
# Regras para escrever perguntas (capítulo 3 da documentação):
#   - linguagem de futebol, sem definição operacional e sem jargão de algoritmo
#     (tests/test_questions.py falha com "betweenness", "xT", "grafo" etc.);
#   - fechadas ("quem", "quantos", "quais"), com resposta única;
#   - a resposta é calculada em todas as leituras razoáveis da pergunta
#     (ground_truth.py); se muda conforme a leitura, a pergunta sai
#     (stage: removed), sem acrescentar definição ao texto;
#   - as tools foram congeladas antes das perguntas (tag v2-tools-frozen):
#     nenhuma tool é criada ou alterada para uma pergunta.
#
# Depois de mudar, recalcule o gabarito e confira contra o grafo:
#   python -m football_graphrag.benchmark.ground_truth
#   python scripts/check_ground_truth.py

match_id: 3869685

# Quais estágios estão ativos e quantas perguntas por tipo eles têm de somar.
# Benchmark principal: [pilot, full] e 5 por tipo. Perguntas de grafo: [graph],
# sem número fixo por tipo (per_type vazio). As duas juntas: [pilot, full, graph].
active_stages: [pilot, full, graph]
per_type:

questions:

  # ---- fact: achar um evento
  - id: f01
    type: fact
    stage: full
    check: player
    text: >-
      Quem recebeu o primeiro cartão amarelo da final?
  - id: f02
    type: fact
    stage: pilot
    check: player
    text: >-
      Quem cometeu a falta que deu origem ao primeiro pênalti da final?
    note: >-
      Dembélé, em Di María (20'). O pênalti é cobrado no minuto seguinte; é preciso achar a
      falta antes dele.
  - id: f03
    type: fact
    stage: pilot
    check: player
    text: >-
      No lance do gol de Messi na prorrogação, o goleiro francês tinha feito uma defesa
      instantes antes. Quem deu o chute que ele defendeu?
    note: >-
      Lautaro Martínez (108'); Messi marcou no rebote.
  - id: f04
    type: fact
    stage: full
    check: player
    text: >-
      Quem deu o passe para o gol que deixou o placar em 2 a 2 no tempo normal?

  - id: f05
    type: fact
    stage: full
    check: player
    text: >-
      Quem fez a última finalização da França na final, antes da disputa de pênaltis?
    note: >-
      Kolo Muani (122'), defendida por Emiliano Martínez. Escrita depois do congelamento da v2.2.
  - id: f06
    type: fact
    stage: candidate
    check: player
    text: >-
      Quem levou cartão amarelo na final sem ter cometido falta?
    note: >-
      Giroud (94'), por reclamação.

  # ---- filtered_aggregation: filtrar, contar e ordenar, com recorte
  - id: a01
    type: filtered_aggregation
    stage: full
    check: player
    text: >-
      Quem deu mais passes certos no terço final do campo pela Argentina?
  - id: a02
    type: filtered_aggregation
    stage: graph
    check: player
    text: >-
      Quem deu mais passes certos no terço final do campo pela França?
    note: >-
      Muda com a leitura: Rabiot e Mbappé empatam ou se alternam conforme o terço seja o de
      origem ou o de destino do passe, e conforme entrem cruzamentos e bolas paradas.
  - id: a03
    type: filtered_aggregation
    stage: pilot
    check: value
    text: >-
      Depois do gol que deixou o placar em 2 a 2 no tempo normal, quantas finalizações a
      Argentina fez até o fim da prorrogação?
  - id: a04
    type: filtered_aggregation
    stage: removed
    check: value
    text: >-
      Depois do gol que deixou o placar em 2 a 2 no tempo normal, quantas finalizações a
      França fez até o fim da prorrogação?
    note: >-
      Muda com a leitura: o próprio chute do 2 a 2 é da França e entra ou não no "depois".
  - id: a05
    type: filtered_aggregation
    stage: pilot
    check: player_and_value
    text: >-
      Enquanto a Argentina vencia por 2 a 0, qual jogador argentino acertou mais passes, e
      quantos?
  - id: a06
    type: filtered_aggregation
    stage: full
    check: player
    text: >-
      Na prorrogação, quem fez mais desarmes certos pela Argentina?

  - id: a07
    type: filtered_aggregation
    stage: full
    check: player
    text: >-
      No segundo tempo, quem cometeu mais faltas?
    note: >-
      Julián Álvarez (4). Escrita depois do congelamento da v2.2.
  - id: a08
    type: filtered_aggregation
    stage: candidate
    check: player
    text: >-
      Na prorrogação, quem completou mais dribles?
  - id: a09
    type: filtered_aggregation
    stage: removed
    check: player
    text: >-
      No primeiro tempo, quem fez mais interceptações?
    note: >-
      Muda com a fonte: no JSON bruto (toda interceptação) é Tchouaméni; na camada 0 (só as certas) é Rabiot.

  # ---- network: um conceito de rede de passes na partida inteira
  - id: n01
    type: network
    stage: removed
    check: player
    text: >-
      Quem era o principal elo da circulação de bola da Argentina?
    note: >-
      Muda com a leitura: Otamendi na maioria das leituras, Enzo Fernández quando a ligação
      pesa pelo número de passes e as duas direções se somam.
  - id: n02
    type: network
    stage: removed
    check: player
    text: >-
      Quem era o principal elo da circulação de bola da França?
    note: >-
      Muda com a leitura: Koundé, Varane ou Rabiot conforme o peso e a direção.
  - id: n03
    type: network
    stage: pilot
    check: player
    text: >-
      Na troca de passes da Argentina, qual jogador, se não estivesse em campo, deixaria
      algum companheiro sem trocar passes com ninguém do time?
    note: >-
      Otamendi: Pezzella, que entrou no fim da prorrogação, só trocou passes com ele.
  - id: n04
    type: network
    stage: pilot
    check: set
    text: >-
      Qual dupla da França mais trocou passes entre si na final?
  - id: n05
    type: network
    stage: full
    check: set
    text: >-
      Qual dupla da Argentina mais trocou passes entre si na final?

  - id: n06
    type: network
    stage: full
    check: player
    text: >-
      Qual jogador da Argentina trocou passes com o maior número de companheiros diferentes na final?
    note: >-
      Enzo Fernández, em qualquer direção e conjunto de passes. Escrita depois do congelamento da v2.2.
  - id: n07
    type: network
    stage: removed
    check: player
    text: >-
      Qual jogador da França trocou passes com o maior número de companheiros diferentes na final?
    note: >-
      Muda com a leitura: Koundé (nas duas direções), Tchouaméni (só para quem passou), empate Rabiot e Koundé (só de quem recebeu).
  - id: n08
    type: network
    stage: candidate
    check: player
    text: >-
      Qual companheiro mais recebeu passes de Messi na final?
  - id: n09
    type: network
    stage: full
    check: set
    text: >-
      Qual sequência de três jogadores da França, com a bola passando de um para o outro, mais se repetiu na final?
    note: >-
      Upamecano, Varane e Koundé (6 vezes) em todas as leituras. A conferência é por conjunto: a ordem não é conferida. Escrita depois do congelamento da v2.2.
  - id: n10
    type: network
    stage: candidate
    check: set
    text: >-
      Qual sequência de três jogadores da Argentina, com a bola passando de um para o outro, mais se repetiu na final?
  - id: n11
    type: network
    stage: graph
    check: player
    text: >-
      Para cortar a bola que chega a Messi, preciso saber: qual companheiro mais passou a bola para ele na final?
    note: >-
      De Paul. Visão do técnico adversário.
  - id: n12
    type: network
    stage: graph
    check: player
    text: >-
      Para marcar Mbappé, preciso saber: qual companheiro mais passou a bola para ele na final?
    note: >-
      Theo Hernández (8 contra 7 de Rabiot; empate em 7 contando só bola rolando). Visão do técnico adversário.

  # ---- network_slice: rede num recorte, ou comparação entre recortes
  - id: s01
    type: network_slice
    stage: pilot
    check: player
    text: >-
      Na prorrogação, quem foi o principal elo da circulação de bola da França?
  - id: s02
    type: network_slice
    stage: removed
    check: player
    text: >-
      Enquanto perdia por 2 a 0, quem era o principal elo da circulação de bola da França?
    note: >-
      Estável em peso e direção (Tchouaméni), mas muda quando só os passes de bola rolando
      contam (Rabiot, Varane).
  - id: s03
    type: network_slice
    stage: full
    check: set
    text: >-
      Depois do gol que deixou o placar em 2 a 2 no tempo normal, qual dupla da França mais
      trocou passes entre si?
  - id: s04
    type: network_slice
    stage: pilot
    check: set
    text: >-
      A dupla da Argentina que mais trocou passes entre si no primeiro tempo continuou sendo
      a principal no segundo tempo? Qual foi a dupla que mais trocou passes no segundo tempo?
    note: >-
      Comparação entre recortes. Só a dupla do 2º tempo é conferida.

  - id: s05
    type: network_slice
    stage: candidate
    check: player
    text: >-
      Na prorrogação, qual jogador da Argentina, se não estivesse em campo, deixaria algum companheiro sem trocar passes com ninguém do time?
    note: >-
      Mesma resposta da n03 (Otamendi): fica na reserva para não repetir o conceito.
  - id: s06
    type: network_slice
    stage: full
    check: player
    text: >-
      No segundo tempo, qual companheiro mais recebeu passes de Enzo Fernández?
    note: >-
      De Paul (9). Escrita depois do congelamento da v2.2.
  - id: s07
    type: network_slice
    stage: full
    check: set
    text: >-
      Na prorrogação, qual sequência de três jogadores da Argentina, com a bola passando de um para o outro, mais se repetiu?
    note: >-
      Otamendi, Romero e Enzo Fernández (3 vezes) em todas as leituras. Conferência por conjunto. Escrita depois do congelamento da v2.2.
  - id: s08
    type: network_slice
    stage: removed
    check: player
    text: >-
      No primeiro tempo, qual jogador da França trocou passes com o maior número de companheiros diferentes?
    note: >-
      Muda com a leitura: Tchouaméni, Koundé, ou empate de três quando conta só de quem recebeu.
  - id: s09
    type: network_slice
    stage: graph
    check: player
    text: >-
      Na prorrogação, qual jogador da Argentina trocou passes com o maior número de companheiros diferentes?
    note: >-
      Empate entre Enzo Fernández e Otamendi numa leitura (só passes de bola rolando, para quem passou).
  - id: s10
    type: network_slice
    stage: graph
    check: set
    text: >-
      No campo de ataque, pelo lado direito, quais dois jogadores da Argentina mais trocaram passes entre si?
    note: >-
      Messi e De Paul. Leitura tática: por onde a Argentina combinava pela direita.
  - id: s11
    type: network_slice
    stage: graph
    check: player
    text: >-
      No campo de ataque, pelo lado esquerdo, quem foi o jogador da Argentina mais procurado pelos companheiros?
    note: >-
      Mac Allister, não Di María. Leitura tática: quem era a referência do lado esquerdo.
  - id: s12
    type: network_slice
    stage: graph
    check: player
    text: >-
      Enquanto a França perdia por 2 a 0, quem foi o jogador francês mais procurado pelos companheiros?
    note: >-
      Upamecano. Leitura tática: a França rodava a bola atrás sem conseguir avançar.
  - id: s13
    type: network_slice
    stage: graph
    check: player
    text: >-
      Depois do gol que deixou o placar em 2 a 2 no tempo normal, quem passou a ser o jogador da França mais procurado pelos companheiros?
    note: >-
      Koundé.

  # ---- unanswerable: parece respondível com eventos, mas os dados não têm
  - id: u01
    type: unanswerable
    stage: pilot
    check: no_data
    text: >-
      Quantos minutos Messi passou no campo de ataque durante a final?
    note: >-
      Dados de eventos só têm posição no instante de cada ação com bola; o tempo em cada
      parte do campo exige rastreamento (tracking). Os dados 360 também são instantâneos.
  - id: u02
    type: unanswerable
    stage: full
    check: no_data
    text: >-
      Qual foi a distância total percorrida por Rodrigo De Paul na final?
    note: >-
      Distância percorrida exige rastreamento contínuo, que o StatsBomb aberto não tem.
  - id: u03
    type: unanswerable
    stage: pilot
    check: no_data
    text: >-
      Quantos piques em alta velocidade Mbappé deu na prorrogação?
    note: >-
      Velocidade de jogador exige rastreamento; os eventos não registram corridas sem bola.
  - id: u04
    type: unanswerable
    stage: full
    check: no_data
    text: >-
      A que velocidade saiu o chute de Mbappé no gol que deixou o placar em 2 a 2?
    note: >-
      O StatsBomb registra local, parte do corpo e desfecho do chute, não a velocidade da bola.
  - id: u05
    type: unanswerable
    stage: full
    check: no_data
    text: >-
      Em quantos lances Mbappé ficou em posição de impedimento sem participar da jogada?
    note: >-
      Os eventos só registram o impedimento marcado; impedimento passivo não vira evento. Os dados 360 mostram posições só no instante de cada ação, e não dizem se o jogador participou. Escrita depois do congelamento da v2.2.
  - id: u06
    type: unanswerable
    stage: candidate
    check: no_data
    text: >-
      Quantas vezes Messi pediu a bola a um companheiro e não a recebeu?
    note: >-
      Pedido de bola não é registrado em dados de eventos.

  # ---- structure: estrutura da rede de passes: triângulos e jogadores que isolariam um companheiro
  - id: t01
    type: structure
    stage: removed
    check: set
    text: >-
      No primeiro tempo, qual trio argentino mais trocou passes entre si, com os três passando a bola uns para os outros?
    note: >-
      Retirada: a formulação é artificial (ninguém pergunta por trios que trocaram passes entre si) e é lida como sequência A -> B -> C; na execução 10, os dois braços a leram assim.
  - id: t02
    type: structure
    stage: removed
    check: set
    text: >-
      Qual trio da França mais trocou passes entre si na final, com os três passando a bola uns para os outros?
    note: >-
      Retirada: a formulação é artificial (ninguém pergunta por trios que trocaram passes entre si) e é lida como sequência A -> B -> C; na execução 10, os dois braços a leram assim.
  - id: t03
    type: structure
    stage: removed
    check: set
    text: >-
      No segundo tempo, qual trio argentino mais trocou passes entre si, com os três passando a bola uns para os outros?
    note: >-
      Retirada: a formulação é artificial (ninguém pergunta por trios que trocaram passes entre si) e é lida como sequência A -> B -> C; na execução 10, os dois braços a leram assim.
  - id: t04
    type: structure
    stage: removed
    check: set
    text: >-
      No primeiro tempo, qual trio francês mais trocou passes entre si, com os três passando a bola uns para os outros?
    note: >-
      Retirada: a formulação é artificial (ninguém pergunta por trios que trocaram passes entre si) e é lida como sequência A -> B -> C; na execução 10, os dois braços a leram assim.
  - id: t05
    type: structure
    stage: removed
    check: set
    text: >-
      Na prorrogação, qual trio argentino mais trocou passes entre si, com os três passando a bola uns para os outros?
    note: >-
      Retirada: a formulação é artificial (ninguém pergunta por trios que trocaram passes entre si) e é lida como sequência A -> B -> C; na execução 10, os dois braços a leram assim.
  - id: t06
    type: structure
    stage: graph
    check: player
    text: >-
      Na prorrogação, qual jogador da França, se não estivesse em campo, deixaria algum companheiro sem trocar passes com ninguém do time?
    note: >-
      Koundé: Coman só trocou passes com ele na prorrogação.
  - id: t07
    type: structure
    stage: removed
    check: set
    text: >-
      Na prorrogação, qual trio francês mais trocou passes entre si, com os três passando a bola uns para os outros?
    note: >-
      Muda com a leitura: empate de três trios contando todos os passes, outro trio quando só contam passes de bola rolando ou as seis direções.

  # ---- counterfactual: contrafactual: a rede recalculada sem um jogador
  - id: c01
    type: counterfactual
    stage: graph
    check: player
    text: >-
      Se Enzo Fernández não estivesse em campo, quem passaria a ser o principal elo da circulação de bola da Argentina?
    note: >-
      Otamendi em todas as leituras.
  - id: c02
    type: counterfactual
    stage: graph
    check: player
    text: >-
      Sem Otamendi em campo, algum companheiro da Argentina ficaria sem trocar passes com ninguém do time? Quem?
    note: >-
      Pezzella, que entrou no fim da prorrogação e só trocou passes com Otamendi.
  - id: c03
    type: counterfactual
    stage: removed
    check: player
    text: >-
      Se Messi não estivesse em campo, quem passaria a ser o principal elo da circulação de bola da Argentina?
    note: >-
      Muda com a leitura: Enzo Fernández na maioria, Otamendi sem peso e sem direção, empate Acuña e Otamendi com peso de xT.
  - id: c04
    type: counterfactual
    stage: removed
    check: player
    text: >-
      Se Varane não estivesse em campo, quem passaria a ser o principal elo da circulação de bola da França?
    note: >-
      Muda com a leitura: Koundé em 10 de 12, Rabiot com peso de xT sem direção.
  - id: c05
    type: counterfactual
    stage: removed
    check: player
    text: >-
      Se Koundé não estivesse em campo, quem passaria a ser o principal elo da circulação de bola da França?
    note: >-
      Muda com a leitura: Rabiot, Tchouaméni, Kolo Muani ou Upamecano.

  # ---- sequence: sequências de passes que terminam em finalização
  - id: q01
    type: sequence
    stage: graph
    check: player
    text: >-
      Qual jogador argentino mais vezes finalizou logo depois de receber um passe de um companheiro?
    note: >-
      Lautaro Martínez.
  - id: q02
    type: sequence
    stage: removed
    check: player
    text: >-
      Quem deu mais vezes o último passe antes de uma finalização da Argentina?
    note: >-
      Muda com a leitura: Di María contando todos os passes; Messi, ou empate Messi e Acuña, só com passes de bola rolando.
  - id: q03
    type: sequence
    stage: graph
    check: player
    text: >-
      Quem deu mais vezes o penúltimo passe nas jogadas da Argentina que terminaram em finalização?
    note: >-
      Empate entre Julián Álvarez e Mac Allister quando só contam passes de bola rolando.
  - id: q04
    type: sequence
    stage: removed
    check: player
    text: >-
      Qual jogador francês mais vezes finalizou logo depois de receber um passe de um companheiro?
    note: >-
      Empate entre Mbappé e Kolo Muani numa leitura.

  # ---- play: jogadas inteiras (fases de posse) e quem participou delas
  - id: p01
    type: play
    stage: graph
    check: set
    text: >-
      Quais dois jogadores argentinos mais vezes participaram juntos das mesmas jogadas que chegaram ao terço final?
    note: >-
      Enzo Fernández e Messi.
  - id: p02
    type: play
    stage: graph
    check: player
    text: >-
      Qual jogador participou de mais jogadas da Argentina que começaram no próprio campo de defesa e terminaram em finalização?
    note: >-
      Messi.
  - id: p03
    type: play
    stage: graph
    check: player
    text: >-
      Qual jogador participou de mais jogadas da Argentina que terminaram em finalização?
    note: >-
      Messi.
  - id: p04
    type: play
    stage: graph
    check: player
    text: >-
      Qual jogador participou de mais jogadas da França que terminaram em finalização?
    note: >-
      Mbappé.
  - id: p05
    type: play
    stage: graph
    check: player
    text: >-
      Nas jogadas da Argentina que terminaram em finalização e em que Messi tocou na bola, qual companheiro mais participou junto com ele?
    note: >-
      Enzo Fernández.
  - id: p06
    type: play
    stage: graph
    check: player
    text: >-
      Nas jogadas da França que terminaram em finalização e em que Mbappé tocou na bola, qual companheiro mais participou junto com ele?
    note: >-
      Rabiot.
  - id: p07
    type: play
    stage: graph
    check: set
    text: >-
      Quais dois jogadores franceses mais vezes participaram juntos das mesmas jogadas que chegaram ao terço final?
    note: >-
      Empate entre Rabiot e Tchouaméni e Rabiot e Mbappé.

  - id: p08
    type: play
    stage: graph
    check: player
    text: >-
      Quem participou de mais jogadas da França que levaram a bola da defesa até o terço final no segundo tempo?
    note: >-
      Muda com a leitura: Kolo Muani se a jogada começa no terço de defesa; empate de três se começa no próprio campo.
  - id: p09
    type: play
    stage: removed
    check: value
    text: >-
      Em quantas jogadas da França que terminaram em finalização na prorrogação Mbappé participou?
    note: >-
      2.
  - id: p10
    type: play
    stage: candidate
    check: player
    text: >-
      Qual jogador participou de mais jogadas da Argentina que terminaram em gol?
    note: >-
      Messi (3). Fica de reserva: as ferramentas não identificam a jogada de cada gol, e a conferência pelo grafo não tem como responder.
  # ---- substitution: antes e depois de uma substituição
  - id: b01
    type: substitution
    stage: removed
